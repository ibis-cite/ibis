name: Preview builds

# Builds the desktop app for Windows, macOS and Linux with checksums and
# build-provenance attestations.
#
# - Same-repository PRs changing this workflow verify packages without publishing.
# - Run manually (Actions → Preview builds → Run workflow) for a dry run:
#   leave publication unchecked; packages stay in workflow artifacts.
# - A maintainer's tag push, or Release Please's explicit dispatch at its tag,
#   verifies and publishes the packages (see RELEASING.md).
#
# Preview builds are unsigned: macOS builds are ad-hoc signed only and
# Windows builds carry no Authenticode signature.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/preview.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified packages (release automation; requires a v tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    # PR dry runs are limited to this repository; forks receive no build token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-15, target: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-15, target: x86_64-apple-darwin }
          - { name: Windows, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # The standard attestation records the workflow's OIDC commit. An older
      # release discovered by a later push must not claim that later source.
      - name: Verify provenance source commit
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$WORKFLOW_SHA" ]; then
            echo "::error::Release and workflow commits differ; rebuild from the release tag as described in RELEASING.md."
            exit 1
          fi

      # Ubuntu 22.04 keeps the Linux packages compatible with older glibc.
      # The app indicator library is needed for the tray item in the AppImage.
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev patchelf xvfb xauth xdotool xclip xterm openbox python3-pyatspi fonts-noto-core fonts-noto-cjk iproute2

      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # hdiutil on hosted macOS runners intermittently fails with "Resource
      # busy" while creating the disk image; a second attempt reuses the
      # compiled app and normally succeeds. Other failures are not retried.
      - name: Build the packages
        working-directory: apps/desktop
        env:
          TARGET: ${{ matrix.target }}
        run: |
          build() { pnpm tauri build --ci --target "$TARGET" -- --locked 2>&1 | tee build.log; return "${PIPESTATUS[0]}"; }
          if ! build; then
            if [ "$RUNNER_OS" = macOS ] && grep -q 'hdiutil: create failed - Resource busy' build.log; then
              echo "::warning::hdiutil reported Resource busy; retrying the build once"
              sleep 15
              build
            else
              exit 1
            fi
          fi

      - name: Select the native release executable
        id: native
        env:
          TARGET: ${{ matrix.target }}
        run: |
          expected=x86_64
          if [ "$TARGET" = aarch64-apple-darwin ]; then expected=arm64; fi
          if [ "$(uname -m)" != "$expected" ]; then
            echo "Cross-target package: compilation and packaging only; no native execution claim."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$RUNNER_OS" in
            macOS)
              bundle="target/$TARGET/release/bundle/macos/Ibis.app"
              executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
              case "$executable" in ''|*/*|*$'\n'*|.|..) exit 1 ;; esac
              app="$bundle/Contents/MacOS/$executable"
              ;;
            Windows) app="target/$TARGET/release/ibis-desktop.exe" ;;
            Linux)
              # Qualify an installed package, with native build prerequisites
              # already present. Installation cannot fetch anything online.
              debs=(target/"$TARGET"/release/bundle/deb/*.deb)
              test "${#debs[@]}" -eq 1
              test -f "${debs[0]}"
              sudo unshare --net -- dpkg --install "${debs[0]}"
              app=/usr/bin/ibis-desktop
              ;;
            *) exit 1 ;;
          esac
          test -f "$app"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Exercise the native release app
        if: steps.native.outputs.enabled == 'true'
        env:
          NATIVE_APP: ${{ steps.native.outputs.app }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # Keep local IPC available; the fresh namespace has no external link.
            sudo unshare --net -- bash -e -c 'ip link set lo up; exec "$@"' -- \
              runuser -u "$(id -un)" -- \
              xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- \
              /usr/bin/python3 scripts/smoke-native.py --app "$NATIVE_APP" --output "native-validation/$RUNNER_OS"
          elif [ "$RUNNER_OS" = Windows ]; then
            python scripts/smoke-native.py --app "$NATIVE_APP" --output "native-validation/$RUNNER_OS"
          else
            python3 scripts/smoke-native.py --app "$NATIVE_APP" --output "native-validation/$RUNNER_OS"
          fi

      - name: Exercise the full-screen native release panel
        if: runner.os == 'macOS' && steps.native.outputs.enabled == 'true'
        env:
          NATIVE_APP: ${{ steps.native.outputs.app }}
        run: python3 scripts/check-panel-macos.py --app "$NATIVE_APP" --output native-validation/panel-macOS

      - name: Exercise the release library chooser and Quit
        if: steps.native.outputs.enabled == 'true'
        env:
          NATIVE_APP: ${{ steps.native.outputs.app }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo unshare --net -- bash -e -c 'ip link set lo up; exec "$@"' -- \
              runuser -u "$(id -un)" -- \
              xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- \
              /usr/bin/python3 scripts/check-native-chooser.py --app "$NATIVE_APP" --output "native-validation/chooser-$RUNNER_OS"
          elif [ "$RUNNER_OS" = Windows ]; then
            python scripts/check-native-chooser.py --app "$NATIVE_APP" --output "native-validation/chooser-$RUNNER_OS"
          else
            python3 scripts/check-native-chooser.py --app "$NATIVE_APP" --output "native-validation/chooser-$RUNNER_OS"
          fi

      - name: Keep native release validation
        if: always() && steps.native.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-validation-${{ matrix.target }}
          path: native-validation/
          if-no-files-found: error
          retention-days: 14

      - name: Collect packages and checksums
        id: collect
        run: |
          bundle=target/${{ matrix.target }}/release/bundle
          mkdir -p dist
          find "$bundle" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          if [ -z "$(ls dist)" ]; then
            echo "no packages were produced in $bundle" >&2
            exit 1
          fi
          # Write the list outside dist first, so it never lists itself.
          sums="SHA256SUMS-${{ matrix.target }}.txt"
          (cd dist && for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done) > "$sums"
          mv "$sums" "dist/$sums"
          cat "dist/SHA256SUMS-${{ matrix.target }}.txt"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Collect compact package verification
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum --check SHA256SUMS-*.txt)
          else
            (cd dist && shasum -a 256 --check SHA256SUMS-*.txt)
          fi
          test -f "$ATTESTATION_BUNDLE"
          for file in dist/*; do
            gh attestation verify "$file" --bundle "$ATTESTATION_BUNDLE" --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/preview.yml" --deny-self-hosted-runners
          done
          mkdir -p package-proof
          cp dist/SHA256SUMS-${{ matrix.target }}.txt package-proof/
          cp "$ATTESTATION_BUNDLE" package-proof/attestation.json
          git rev-parse HEAD > package-proof/SOURCE_SHA.txt

      - name: Keep package verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-proof-${{ matrix.target }}
          path: package-proof/*
          if-no-files-found: error
          retention-days: 14

      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ibis-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish pre-release
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ibis-*
          merge-multiple: true

      - name: Verify checksums and tag-bound provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS-*.txt)
          for file in dist/*; do
            gh attestation verify "$file" --repo "$REPO" --source-ref "$SOURCE_REF" --source-digest "$SOURCE_SHA" --signer-workflow "$REPO/.github/workflows/preview.yml"
          done

      - name: Publish the verified pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          **Preview build. Not signed.** After verifying your download below, macOS may say the app cannot be checked for malicious software. Follow [Apple's instructions](https://support.apple.com/en-us/102445): try opening Ibis, then use System Settings → Privacy & Security → Open Anyway and confirm Open. Windows SmartScreen may warn: choose More info, then Run anyway.

          **Automated checks:** matching-host Windows, macOS and Linux package builds pass native shortcut, search, copy, focus, library recovery and shutdown checks. Linux runs the installed Debian package with no external network interface; matching-host macOS also checks the full-screen panel. Cross-target Mac builds establish packaging only. See [preview validation](https://github.com/ibiscite/ibis/blob/main/docs/preview-validation.md) for the tested scope and measurement limits.

          **Hand testing:** [issue #80](https://github.com/ibiscite/ibis/issues/80) records actual hand-test results and pending checks. Automation does not establish screen-reader speech, physical display changes, sleep/wake, every keyboard layout or synced-folder behavior. The short Windows and Mac hand lists are in [the testing guide](https://github.com/ibiscite/ibis/blob/main/docs/testing.md#remaining-hand-checks-after-all-three-cloud-runs-pass).

          Verify a download before opening it:

          - Checksums: compare the output of `shasum -a 256 <file>` (macOS, Linux) or `Get-FileHash <file>` (Windows) with the `SHA256SUMS-*.txt` files below.
          - Provenance: run `gh attestation verify <file> --repo ibiscite/ibis --source-ref refs/tags/TAG --signer-workflow ibiscite/ibis/.github/workflows/preview.yml`, replacing TAG with this release's tag. This rejects builds from other branches.
          EOF
          cat > windows-setup.md <<'EOF'
          **Windows installation:** if Microsoft WebView2 Runtime is missing, the installer downloads Microsoft's WebView2 bootstrapper and uses it to install the runtime. This one-time prerequisite setup requires an internet connection. The Ibis app works offline after setup.

          EOF
          if gh release view "$TAG" --repo "$REPO" --json body,isDraft > release.json; then
            if [ "$(jq -r .isDraft release.json)" != true ]; then
              echo "::error::The release is already public; refusing to replace its packages."
              exit 1
            fi
            jq -r .body release.json > existing-notes.md
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            cp existing-notes.md combined-notes.md
            if ! grep -Fq '**Preview build. Not signed.**' existing-notes.md; then
              cat notes.md existing-notes.md > combined-notes.md
            fi
            if ! grep -Fq '**Windows installation:**' combined-notes.md; then
              cat windows-setup.md combined-notes.md > updated-notes.md
              mv updated-notes.md combined-notes.md
            fi
            gh release edit "$TAG" --repo "$REPO" --prerelease --draft=false --notes-file combined-notes.md
          else
            cat windows-setup.md notes.md > combined-notes.md
            gh release create "$TAG" dist/* --repo "$REPO" --prerelease --draft --title "Ibis $TAG (preview)" --notes-file combined-notes.md --verify-tag
            gh release edit "$TAG" --repo "$REPO" --draft=false
          fi
